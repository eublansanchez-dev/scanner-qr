<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Escanear ficha WiFi</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #1E90FF;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
}

.contenedor {
    max-width: 420px;
    margin: auto;
    background: white;
    padding: 25px 20px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,.25);
}

h1 {
    margin-top: 5px;
    font-size: 25px;
}

p {
    font-size: 16px;
}

video {
    width: 100%;
    max-width: 360px;
    margin-top: 15px;
    border-radius: 12px;
    background: black;
}

canvas {
    display: none;
}

#resultado {
    margin-top: 15px;
    padding: 15px;
    background: #eeeeee;
    border-radius: 8px;
    font-size: 15px;
    word-break: break-all;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 15px;
    border: none;
    border-radius: 7px;
    background: #25a244;
    color: white;
    font-size: 17px;
    font-weight: bold;
}

</style>

</head>


<body>


<div class="contenedor">

<h1>📷 Escanear ficha</h1>

<p>
Apunta la cámara al código QR de tu ficha.
</p>


<video
    id="video"
    autoplay
    playsinline>
</video>


<canvas id="canvas"></canvas>


<div id="resultado">

📷 Apunta la cámara al código QR...

</div>


<button onclick="location.reload()">

🔄 INTENTAR NUEVAMENTE

</button>


</div>


<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>


<script>

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const contexto =
    canvas.getContext("2d");

const resultado =
    document.getElementById("resultado");

let escaneando = true;


/* =========================
   ABRIR CÁMARA
   ========================= */

navigator.mediaDevices.getUserMedia({

    video: {

        facingMode: {
            ideal: "environment"
        }

    },

    audio: false

})

.then(function(stream) {

    video.srcObject = stream;

    video.play();

    resultado.innerHTML =
        "📷 Cámara activa.<br>" +
        "Apunta al código QR.";

    leerQR();

})

.catch(function(error) {

    console.log(error);

    resultado.innerHTML =
        "❌ No se pudo abrir la cámara.<br><br>" +
        error.message;

});


/* =========================
   LEER QR
   ========================= */

function leerQR() {

    if (!escaneando) {
        return;
    }


    if (
        video.readyState ===
        video.HAVE_ENOUGH_DATA
    ) {


        canvas.width =
            video.videoWidth;

        canvas.height =
            video.videoHeight;


        contexto.drawImage(

            video,

            0,

            0,

            canvas.width,

            canvas.height

        );


        const imagen =
            contexto.getImageData(

                0,

                0,

                canvas.width,

                canvas.height

            );


        const codigo =
            jsQR(

                imagen.data,

                imagen.width,

                imagen.height

            );


        if (codigo) {

            escaneando = false;


            /* DETENER CÁMARA */

            if (video.srcObject) {

                video.srcObject
                    .getTracks()
                    .forEach(
                        function(track) {

                            track.stop();

                        }
                    );

            }


            /* MOSTRAR CONTENIDO REAL DEL QR */

            resultado.innerHTML =

                "<b>✅ QR LEÍDO</b>" +

                "<br><br>" +

                "<b>Contenido del QR:</b>" +

                "<br><br>" +

                codigo.data;


            console.log(
                "CONTENIDO QR:",
                codigo.data
            );


            return;

        }

    }


    requestAnimationFrame(
        leerQR
    );

}

</script>


</body>

</html>
