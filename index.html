<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Escanear ficha WiFi</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #1E90FF;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
}

.contenedor {
    max-width: 420px;
    margin: auto;
    background: white;
    padding: 25px 20px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,.25);
}

h1 {
    font-size: 25px;
}

video {
    width: 100%;
    max-width: 360px;
    border-radius: 12px;
    background: black;
}

#resultado {
    margin-top: 15px;
    padding: 15px;
    background: #eeeeee;
    border-radius: 8px;
    word-break: break-all;
}

button {
    width: 100%;
    padding: 13px;
    margin-top: 15px;
    border: none;
    border-radius: 7px;
    background: #25a244;
    color: white;
    font-size: 17px;
    font-weight: bold;
}

</style>

</head>

<body>

<div class="contenedor">

<h1>📷 Escanear ficha</h1>

<p>
Apunta la cámara al código QR de tu ficha.
</p>

<video id="video"
       autoplay
       playsinline>
</video>

<canvas id="canvas"
        style="display:none;">
</canvas>

<div id="resultado">
📷 Iniciando cámara...
</div>

<button onclick="location.reload()">
🔄 INTENTAR NUEVAMENTE
</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

<script>

const video =
document.getElementById("video");

const canvas =
document.getElementById("canvas");

const ctx =
canvas.getContext("2d");

const resultado =
document.getElementById("resultado");

let escaneando = true;


/* =========================
   CÁMARA
   ========================= */

navigator.mediaDevices
.getUserMedia({

    video: {
        facingMode: {
            ideal: "environment"
        }
    },

    audio: false

})
.then(function(stream) {

    video.srcObject = stream;

    video.play();

    resultado.innerHTML =
        "📷 Apunta al código QR de tu ficha.";

    leerQR();

})
.catch(function(error) {

    resultado.innerHTML =
        "❌ No se pudo abrir la cámara.";

});


/* =========================
   LEER QR
   ========================= */

function leerQR() {

    if (!escaneando) {
        return;
    }


    if (video.readyState ===
        video.HAVE_ENOUGH_DATA) {


        canvas.width =
            video.videoWidth;

        canvas.height =
            video.videoHeight;


        ctx.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
        );


        const imagen =
            ctx.getImageData(
                0,
                0,
                canvas.width,
                canvas.height
            );


        const codigo =
            jsQR(
                imagen.data,
                imagen.width,
                imagen.height
            );


        if (codigo) {

            escaneando = false;


            /* DETENER CÁMARA */

            if (video.srcObject) {

                video.srcObject
                .getTracks()
                .forEach(function(track) {

                    track.stop();

                });

            }


            procesarQR(codigo.data);

            return;
        }

    }


    requestAnimationFrame(
        leerQR
    );

}


/* =========================
   PROCESAR QR
   ========================= */

function procesarQR(texto) {

    texto = texto.trim();


    /*
       EJEMPLO REAL DEL QR:

       jvc.net?userman=XXXX&password=XXXX
    */


    let datos;


    try {

        /*
           Agregamos http:// solamente
           para que JavaScript pueda
           interpretar correctamente
           jvc.net?...
        */

        let urlTexto = texto;

        if (
            !urlTexto.startsWith("http://") &&
            !urlTexto.startsWith("https://")
        ) {

            urlTexto =
                "http://" + urlTexto;

        }


        const url =
            new URL(urlTexto);


        const usuario =
            url.searchParams.get("userman");

        const password =
            url.searchParams.get("password");


        console.log(
            "Usuario:",
            usuario
        );

        console.log(
            "Password:",
            password
        );


        if (!usuario || !password) {

            resultado.innerHTML =
                "❌ No se encontraron " +
                "usuario y contraseña en el QR.";

            return;

        }


        /*
           AQUÍ CONSTRUIMOS EL LOGIN
           REAL DEL MIKROTIK
        */

        const loginURL =
            "http://192.168.88.1/login" +
            "?username=" +
            encodeURIComponent(usuario) +
            "&password=" +
            encodeURIComponent(password);


        resultado.innerHTML =
            "✅ Ficha encontrada.<br><br>" +
            "Conectando a Internet...";


        /*
           ESPERAMOS UN MOMENTO Y
           REDIRIGIMOS AL MIKROTIK
        */

        setTimeout(function() {

            window.location.href =
                loginURL;

        }, 1000);


    }

    catch(error) {

        console.log(error);

        resultado.innerHTML =
            "❌ No se pudo interpretar " +
            "el código QR.";

    }

}

</script>

</body>
</html>
